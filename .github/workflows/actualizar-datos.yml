name: Actualizar UVA y feriados

on:
  schedule:
    # 09:15 UTC = 06:15 hora Argentina. El BCRA suele publicar el valor del
    # día durante la mañana; si un día no está disponible todavía, no pasa
    # nada: el front usa el último valor disponible como estimado.
    - cron: "15 9 * * *"
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña "Actions"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Actualizar Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/actualizar-datos.mjs
