<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartilla del crédito UVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --tinta: #142430;
    --tinta-suave: #1d3444;
    --papel: #f4f1e8;
    --papel-linea: #ddd6c2;
    --verde-billete: #3d6b52;
    --verde-billete-suave: #e7efe9;
    --oro: #b9903f;
    --texto-claro: #eef0e6;
    --texto-oscuro: #24211a;
    --texto-tenue: #6f6a5a;
    --rojo-atencion: #9c4a3c;
    --radio: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papel);
    color: var(--texto-oscuro);
    font-family: "IBM Plex Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .num, .tabular {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  h1, h2, h3 {
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    margin: 0;
  }

  #estado-carga {
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--texto-tenue);
    font-family: "IBM Plex Mono", monospace;
  }

  #app { display: none; max-width: 960px; margin: 0 auto; padding-bottom: 4rem; }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--tinta);
    color: var(--texto-claro);
    padding: 2.2rem 1.5rem 1.6rem;
  }
  .hero__marca {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.6rem;
  }
  .hero__marca h1 { font-size: 1.15rem; letter-spacing: 0.01em; color: var(--texto-claro); }
  .hero__marca span { font-size: 0.8rem; color: #9fb0ad; font-family: "IBM Plex Mono", monospace; }

  .hero__principal { display: flex; flex-wrap: wrap; gap: 2.5rem; align-items: flex-end; }
  .hero__saldo-label { font-size: 0.82rem; color: #9fb0ad; margin-bottom: 0.3rem; }
  .hero__saldo-monto { font-family: "Source Serif 4", serif; font-size: 2.6rem; line-height: 1; color: var(--texto-claro); }
  .hero__saldo-uva { font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; color: #cfd9c5; margin-top: 0.35rem; }
  .hero__uva-hoy { font-size: 0.78rem; color: #9fb0ad; margin-top: 0.5rem; }

  .hero__proxima {
    border-left: 1px solid #33505a;
    padding-left: 2rem;
    min-width: 220px;
  }
  .hero__proxima-label { font-size: 0.82rem; color: #9fb0ad; margin-bottom: 0.3rem; }
  .hero__proxima-fecha { font-family: "Source Serif 4", serif; font-size: 1.3rem; }
  .hero__proxima-detalle { font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; color: #cfd9c5; margin-top: 0.3rem; }
  .hero__proxima-monto { font-family: "IBM Plex Mono", monospace; font-size: 1.15rem; color: var(--texto-claro); margin-top: 0.15rem; }

  .estampa {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    padding: 0.15rem 0.45rem;
    border: 1px solid var(--texto-tenue);
    border-radius: var(--radio);
    color: var(--texto-tenue);
  }
  .estampa--ok { color: var(--verde-billete); border-color: var(--verde-billete); }
  .estampa--estimado { color: var(--oro); border-color: var(--oro); }

  /* ---------- Nav ---------- */
  nav.tabs {
    display: flex;
    gap: 0.25rem;
    padding: 0.9rem 1.5rem 0;
    background: var(--tinta);
  }
  nav.tabs button {
    background: transparent;
    border: none;
    color: #9fb0ad;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    padding: 0.6rem 0.9rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.activo {
    color: var(--texto-claro);
    border-bottom-color: var(--oro);
  }

  /* ---------- Secciones ---------- */
  .seccion { display: none; padding: 1.6rem 1.5rem; }
  .seccion--activa { display: block; }

  .panel {
    background: #fff;
    border: 1px solid var(--papel-linea);
    border-radius: var(--radio);
    padding: 1.2rem 1.4rem;
    margin-bottom: 1.2rem;
  }
  .panel h2 { font-size: 1.05rem; margin-bottom: 0.9rem; }

  #datos-fijos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.9rem; }
  #datos-fijos div { display: flex; flex-direction: column; gap: 0.15rem; border-top: 1px solid var(--papel-linea); padding-top: 0.5rem; }
  #datos-fijos span { font-size: 0.75rem; color: var(--texto-tenue); }
  #datos-fijos strong { font-family: "IBM Plex Mono", monospace; font-size: 0.95rem; }

  .progreso-linea { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; color: var(--texto-tenue); }

  /* ---------- Tabla cuadro ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    text-align: left;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    color: var(--texto-tenue);
    border-bottom: 1px solid var(--texto-oscuro);
    padding: 0.4rem 0.5rem;
  }
  td { padding: 0.5rem; border-bottom: 1px solid var(--papel-linea); vertical-align: middle; }
  td.num { text-align: right; font-family: "IBM Plex Mono", monospace; }
  th.num { text-align: right; }

  .btn-primario, .btn-link {
    font-family: "IBM Plex Sans", sans-serif;
    cursor: pointer;
    border-radius: var(--radio);
  }
  .btn-primario {
    background: var(--verde-billete);
    color: #fff;
    border: none;
    padding: 0.4rem 0.7rem;
    font-size: 0.8rem;
  }
  .btn-link {
    background: none;
    border: none;
    color: var(--texto-tenue);
    font-size: 0.78rem;
    text-decoration: underline;
    padding: 0;
  }

  #toggle-todas {
    background: none;
    border: 1px solid var(--texto-tenue);
    color: var(--texto-oscuro);
    padding: 0.4rem 0.8rem;
    font-size: 0.8rem;
    border-radius: var(--radio);
    cursor: pointer;
    margin-bottom: 0.9rem;
  }

  /* ---------- Gastos ---------- */
  #form-gasto { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: flex-end; }
  #form-gasto label { display: flex; flex-direction: column; font-size: 0.75rem; color: var(--texto-tenue); gap: 0.25rem; }
  #form-gasto input, #form-gasto select {
    font-family: "IBM Plex Sans", sans-serif;
    padding: 0.45rem 0.5rem;
    border: 1px solid var(--papel-linea);
    border-radius: var(--radio);
    font-size: 0.85rem;
  }
  #form-gasto button {
    background: var(--verde-billete);
    color: #fff;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: var(--radio);
    font-size: 0.85rem;
    cursor: pointer;
    height: 2.15rem;
  }

  .bloque-mes { margin-bottom: 1.1rem; }
  .bloque-mes__header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--texto-oscuro);
    margin-bottom: 0.3rem;
  }
  .bloque-mes__header h3 { font-size: 0.95rem; text-transform: capitalize; }
  .bloque-mes__header strong { font-family: "IBM Plex Mono", monospace; }
  .rubro { text-transform: capitalize; color: var(--verde-billete); font-size: 0.8rem; }

  @media (max-width: 600px) {
    .hero__proxima { border-left: none; padding-left: 0; border-top: 1px solid #33505a; padding-top: 1rem; width: 100%; }
    .hero__saldo-monto { font-size: 2rem; }

    table.tabla-responsiva thead { display: none; }
    table.tabla-responsiva, table.tabla-responsiva tbody, table.tabla-responsiva tr, table.tabla-responsiva td {
      display: block;
      width: 100%;
    }
    table.tabla-responsiva tr {
      border: 1px solid var(--papel-linea);
      border-radius: var(--radio);
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.7rem;
    }
    table.tabla-responsiva td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 0;
      border-bottom: 1px dashed var(--papel-linea);
      text-align: right;
    }
    table.tabla-responsiva td:last-child { border-bottom: none; }
    table.tabla-responsiva td::before {
      content: attr(data-label);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      color: var(--texto-tenue);
      text-align: left;
      flex-shrink: 0;
    }
  }
</style>
</head>
<body>

<div id="estado-carga">Cargando cartilla…</div>

<div id="app">

  <header class="hero">
    <div class="hero__marca">
      <h1>Cartilla del crédito UVA</h1>
      <span id="cuotas-pagadas-label">cuotas pagadas: <span id="cuotas-pagadas" class="tabular">—</span></span>
    </div>
    <div class="hero__principal">
      <div>
        <div class="hero__saldo-label">Saldo de capital adeudado hoy</div>
        <div class="hero__saldo-monto" id="saldo-pesos">—</div>
        <div class="hero__saldo-uva" id="saldo-uva">—</div>
        <div class="hero__uva-hoy" id="uva-hoy">—</div>
      </div>
      <div class="hero__proxima">
        <div class="hero__proxima-label">Próxima cuota</div>
        <div class="hero__proxima-fecha" id="proxima-fecha">—</div>
        <div class="hero__proxima-detalle"><span id="proxima-uva"></span> · <span id="proxima-estado" class="estampa"></span></div>
        <div class="hero__proxima-monto" id="proxima-monto"></div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="tab-resumen" class="activo">Resumen</button>
    <button data-tab="tab-cuadro">Cuadro de cuotas</button>
    <button data-tab="tab-gastos">Gastos del hogar</button>
  </nav>

  <section id="tab-resumen" class="seccion seccion--activa">
    <div class="panel">
      <h2>Datos del crédito</h2>
      <div id="datos-fijos"></div>
    </div>
  </section>

  <section id="tab-cuadro" class="seccion">
    <div class="panel">
      <h2>Cuadro de amortización</h2>
      <button id="toggle-todas">Ver cuadro completo (360 cuotas)</button>
      <table class="tabla-responsiva">
        <thead>
          <tr>
            <th>Nº</th>
            <th>Vencimiento</th>
            <th class="num">UVA cuota</th>
            <th class="num">UVA capital</th>
            <th class="num">UVA interés</th>
            <th class="num">Valor UVA</th>
            <th class="num">Monto $</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-cuadro-body"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-gastos" class="seccion">
    <div class="panel">
      <h2>Cargar gasto</h2>
      <form id="form-gasto">
        <label>Rubro
          <select name="rubro" required>
            <option value="expensas">Expensas</option>
            <option value="luz">Luz</option>
            <option value="gas">Gas</option>
            <option value="internet">Internet</option>
            <option value="seguro">Seguro</option>
            <option value="otro">Otro</option>
          </select>
        </label>
        <label>Monto ($)
          <input type="number" name="monto" step="0.01" min="0" required />
        </label>
        <label>Fecha de pago
          <input type="date" name="fecha" required />
        </label>
        <label>Notas
          <input type="text" name="notas" placeholder="opcional" />
        </label>
        <button type="submit">Guardar</button>
      </form>
    </div>
    <div class="panel">
      <h2>Historial por mes</h2>
      <div id="gastos-lista"></div>
    </div>
  </section>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
